name: Shopify postback tests
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/shopify-postback-tests.yml'
  push:
    branches:
      - feature/shopify-app-only-auth-20261104
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
