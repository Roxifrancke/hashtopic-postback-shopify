name: Staging pixel referral candidate tests
on:
  push:
    branches:
      - feature/staging-pixel-consented-referral-capture-20261105
  pull_request:
    paths:
      - 'extensions/mystorefront-staging-pixel/src/**'
      - 'web/tests/staging-pixel-referral-candidate.test.js'
      - '.github/workflows/staging-pixel-referral-candidate-tests.yml'
permissions:
  contents: read
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check staging pixel modules
        run: |
          node --check extensions/mystorefront-staging-pixel/src/index.js
          node --check extensions/mystorefront-staging-pixel/src/referral-candidate.js
      - name: Run consent and validation unit tests
        run: node --test web/tests/staging-pixel-referral-candidate.test.js
