name: Staging attested click verification

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Run all staging and integration unit tests
        working-directory: web
        run: npm test
      - name: Syntax check verifier and audit
        working-directory: web
        run: |
          node --check backend/web-pixel-staging-trusted-referral.js
          node --check scripts/staging-trusted-referral-audit.mjs
