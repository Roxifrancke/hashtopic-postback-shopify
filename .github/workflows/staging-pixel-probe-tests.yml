name: Staging Web Pixel CORS probe tests
on:
  pull_request:
    branches: [staging]
    paths:
      - 'web/backend/routes/web-pixel-transport-probe.js'
      - 'web/backend/index.js'
      - 'web/tests/web-pixel-transport-probe.test.js'
      - '.github/workflows/staging-pixel-probe-tests.yml'
permissions:
  contents: read
jobs:
  probe-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install staging dependencies
        run: npm install --no-audit --no-fund
      - name: Test isolated transport probe
        run: node --test tests/web-pixel-transport-probe.test.js
      - name: Syntax-check backend entrypoint
        run: node --check backend/index.js
