name: Shopify health tests
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/shopify-health-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
