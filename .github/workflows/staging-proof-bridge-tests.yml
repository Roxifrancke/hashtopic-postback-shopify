name: Staging proof bridge audit tests
on:
  pull_request:
    branches: [staging]
  workflow_dispatch:
jobs:
  node-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run staging tests
        working-directory: web
        run: npm test
      - name: Check secure bridge syntax
        working-directory: web
        run: |
          node --check backend/web-pixel-staging-proof-bridge.js
          node --check scripts/staging-proof-bridge-audit.mjs
