# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "80133e649bd215aa494b9e54f91aa0f3"
name = "MyStorefront Postback"
application_url = "https://mystorefront-postback.onrender.com"
embedded = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = ["orders/paid", "orders/updated", "refunds/create"]
  uri = "/api/webhooks"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://mystorefront-postback.onrender.com/api/webhooks/gdpr/customers_redact"
  customer_data_request_url = "https://mystorefront-postback.onrender.com/api/webhooks/gdpr/customers_data_request"
  shop_deletion_url = "https://mystorefront-postback.onrender.com/api/webhooks/gdpr/shop_redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_customers,read_price_rules,write_price_rules"
# Optional: only request these on test stores until GraphQL discount sync is proven.
# Do not force existing installed brands through new required-scope consent.
optional_scopes = ["read_discounts", "write_discounts"]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://mystorefront-postback.onrender.com/api/auth/callback"
]
