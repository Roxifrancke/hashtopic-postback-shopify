# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "80133e649bd215aa494b9e54f91aa0f3"
name = "MyStorefront Postback"
application_url = "https://mystorefront-postback.onrender.com"
embedded = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated", "refunds/create", "orders/paid" ]
  uri = "/api/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "discounts/create", "discounts/update", "discounts/delete" ]
  uri = "/api/webhooks"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/gdpr/customers_data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/gdpr/customers_redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/gdpr/shop_redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_price_rules,write_price_rules,write_pixels,read_customer_events,write_app_proxy,write_discounts,write_validations"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://mystorefront-postback.onrender.com/api/auth/callback"
]

[app_proxy]
url = "https://mystorefront-postback.onrender.com/proxy"
subpath = "mystorefront"
prefix = "apps"
