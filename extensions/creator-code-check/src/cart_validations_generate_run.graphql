query CartValidationsGenerateRunInput {
  cart {
    attribute(key: "MyStorefront creator") {
      value
    }
    lines {
      attribute(key: "_MyStorefront creator") {
        value
      }
    }
    discountApplications {
      metafield(namespace: "$app:mystorefront", key: "code_rule") {
        value
      }
    }
  }
  shop {
    metafield(namespace: "$app:mystorefront", key: "referral_rules") {
      value
    }
  }
}
