api_version = "2025-07"

[[extensions]]
name = "Creator code check"
handle = "creator-code-check"
type = "function"
description = "Blocks discount codes on creator-referred carts when the brand chooses Block."

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/cart_validations_generate_run.graphql"
  export = "cart-validations-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
