api_version = "2026-10"

[[extensions]]
name = "Creator code remove"
handle = "creator-code-remove"
type = "function"
description = "Removes discount codes that aren't allowed on creator-referred carts."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
