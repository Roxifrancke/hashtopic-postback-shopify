query CartLinesDiscountsGenerateRunInput {
  cart {
    attribute(key: "MyStorefront creator") {
      value
    }
    lines {
      attribute(key: "_MyStorefront creator") {
        value
      }
    }
  }
  enteredDiscountCodes {
    code
    rejectable
  }
  shop {
    metafield(namespace: "$app:mystorefront", key: "referral_rules") {
      value
    }
  }
}
