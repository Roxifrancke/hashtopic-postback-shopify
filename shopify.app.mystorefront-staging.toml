# STAGING SHOPIFY APP ONLY. Never select this config for production.
# Explicitly use: shopify app deploy --config mystorefront-staging --no-release
client_id = "2f3aa895637da2cc63111d4922a5dd17"
name = "MyStorefront Postback Staging"
application_url = "https://hashtopic-postback-shopify-staging.onrender.com"
embedded = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["orders/paid", "refunds/create"]
  uri = "/api/webhooks"

  [[webhooks.subscriptions]]
  topics = ["discounts/create", "discounts/update"]
  uri = "/api/webhooks"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://hashtopic-postback-shopify-staging.onrender.com/api/webhooks/gdpr/customers_redact"
  customer_data_request_url = "https://hashtopic-postback-shopify-staging.onrender.com/api/webhooks/gdpr/customers_data_request"
  shop_deletion_url = "https://hashtopic-postback-shopify-staging.onrender.com/api/webhooks/gdpr/shop_redact"

[access_scopes]
scopes = "read_customers,read_discounts,read_orders,read_price_rules,read_products,read_script_tags,read_themes,write_orders,write_price_rules,write_script_tags,write_themes,write_pixels,read_customer_events,read_pixels,write_app_proxy,write_discounts,write_validations"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://hashtopic-postback-shopify-staging.onrender.com/api/auth/callback"
]

[app_proxy]
url = "https://hashtopic-postback-shopify-staging.onrender.com/proxy"
subpath = "mystorefront"
prefix = "apps"
